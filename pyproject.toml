[project]
name = "financial-dw"
version = "0.1.0"
description = "Lending Club financial data warehouse: DuckDB star schema, ETL, Spark Parquet, Streamlit analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.2",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pyspark>=4.1.1",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
