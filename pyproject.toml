[project]
name = "financial-dw"
version = "0.1.0"
description = "Lending Club financial data warehouse: DuckDB star schema, ETL, Spark Parquet, Streamlit analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.2",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pyspark>=4.1.1",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
modeling = [
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
]
